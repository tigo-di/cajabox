<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manabox</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <aside class="sidebar">
      <div class="sidebar-scroll">
        <div class="brand"><img class="brand-icon" src="/src-tauri/icons/icon.svg" alt="" />manabox</div>
        <div class="sidebar-title">
          <h2 data-i18n="sidebar.folders">Pastas</h2>
          <button id="edit-folders" class="link" type="button" data-i18n="sidebar.edit">Editar</button>
        </div>
        <nav id="folders"></nav>
        <div class="sidebar-title filters-title">
          <h2 data-i18n="sidebar.filters">Filtros</h2>
          <span>
            <button id="clear-filters" class="link" type="button" hidden data-i18n="sidebar.clear">Limpar</button>
            <button id="edit-index" class="link" type="button" data-i18n="sidebar.editIndex">Editar índice</button>
          </span>
        </div>
        <div id="filters"></div>
      </div>
      <footer class="sidebar-footer">
        <button id="open-settings" class="link" type="button" data-i18n="sidebar.settings">Configurações</button>
        <button id="open-about" class="link" type="button" data-i18n="sidebar.about">Sobre</button>
        <button id="quit" class="link" type="button" data-i18n="sidebar.quit">Fechar</button>
      </footer>
    </aside>

    <main class="main">
      <header id="folder-header"></header>
      <div id="searchbar" hidden>
        <input id="search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-label="search.label" autocomplete="off" spellcheck="false" />
      </div>
      <div id="toolbar"></div>
      <section id="content"></section>
    </main>
  </body>
</html>
